name: Install All Ecosystem Packages-API-KEY

on:
  workflow_dispatch:

env:
  # Rotate this token — a plaintext app_token committed in YAML should be moved to
  # a repo/org secret (e.g. ${{ secrets.IR_APP_TOKEN }}).
  IR_APP_TOKEN: KM3ViAikKmTPJOYKawGi-frMevfui2MtjrNnEsCNe81ZfbWAch9nWU4le0UVz6nyDV4gJpUH2txYoI6dF1AWfw

jobs:
  npm:
    name: npm (Node.js)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  pip:
    name: pip (Python)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  maven:
    name: mvn (Java)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: mvn dependency:resolve --no-transfer-progress

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  deno:
    name: deno cache
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno install

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  dotnet:
    name: dotnet restore (NuGet)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore packages.csproj

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  bundler:
    name: bundle install (Ruby)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

  go:
    name: go mod download
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (after setup)=$PID"

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid (before cleanup)=$PID"

