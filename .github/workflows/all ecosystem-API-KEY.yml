name: Install All Ecosystem Packages-API-KEY

on:
  workflow_dispatch:

env:
  # Rotate this token — a plaintext app_token committed in YAML should be moved to
  # a repo/org secret (e.g. ${{ secrets.IR_APP_TOKEN }}).
  IR_APP_TOKEN: KM3ViAikKmTPJOYKawGi-frMevfui2MtjrNnEsCNe81ZfbWAch9nWU4le0UVz6nyDV4gJpUH2txYoI6dF1AWfw

jobs:
  npm:
    name: npm (Node.js)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ env.IR_APP_TOKEN }}
      # ============= InvisiRisk Setup End =============
      - name: Print PSE PID (after setup)
        run: |
          PIDS=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u | paste -sd' ')
          PIDS="${PIDS:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid(s) (after setup)=$PIDS"
          echo "-------------------------------PSE_PROXY_IP (after setup)=${PSE_PROXY_IP}"
          echo "-------------------------------HTTP_PROXY (after setup)=${HTTP_PROXY:-$http_proxy}"
          echo "-------------------------------HTTPS_PROXY (after setup)=${HTTPS_PROXY:-$https_proxy}"
          echo "-------------------------------port sweep 10.1.0.0/24 (12345, 3128)"
          for i in $(seq 1 254); do
            host="10.1.0.$i"
            for port in 12345 3128; do
              if timeout 1 bash -c "echo > /dev/tcp/$host/$port" 2>/dev/null; then
                echo "OPEN  $host:$port"
              fi
            done
          done
          echo "-------------------------------sweep done"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Print PSE PID (before cleanup)
        if: always()
        run: |
          PIDS=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u | paste -sd' ')
          PIDS="${PIDS:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid(s) (before cleanup)=$PIDS"
          echo "-------------------------------PSE_PROXY_IP (before cleanup)=${PSE_PROXY_IP}"
          echo "-------------------------------HTTP_PROXY (before cleanup)=${HTTP_PROXY:-$http_proxy}"
          echo "-------------------------------HTTPS_PROXY (before cleanup)=${HTTPS_PROXY:-$https_proxy}"

  pip:
