          PIDS="${PIDS:-$PSE_PID}"
          echo "-------------------------------PSE proxy pid(s) (before cleanup)=$PIDS"
          echo "-------------------------------PSE_PROXY_IP (before cleanup)=${PSE_PROXY_IP}"
          echo "-------------------------------HTTP_PROXY (before cleanup)=${HTTP_PROXY:-$http_proxy}"
          echo "-------------------------------HTTPS_PROXY (before cleanup)=${HTTPS_PROXY:-$https_proxy}"

