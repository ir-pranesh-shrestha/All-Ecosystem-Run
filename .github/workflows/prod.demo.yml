name: Internal multi-stage run demonstration

on:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  npm:
    name: npm (Node.js)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: Lk0jD_w2QVSqm_-8AyQEtstYohkJkT8w5y_fj2rb2w7X_n7jyT1g-F8xMM9DKi0uNnlQ7XvnDiSSCUEl1KxO6Q
          collect_dependencies: false
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

  pip:
    name: pip (Python)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: Lk0jD_w2QVSqm_-8AyQEtstYohkJkT8w5y_fj2rb2w7X_n7jyT1g-F8xMM9DKi0uNnlQ7XvnDiSSCUEl1KxO6Q
          collect_dependencies: false
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

