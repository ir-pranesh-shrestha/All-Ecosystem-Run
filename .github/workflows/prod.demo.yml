  deno:
    name: deno cache
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: Lk0jD_w2QVSqm_-8AyQEtstYohkJkT8w5y_fj2rb2w7X_n7jyT1g-F8xMM9DKi0uNnlQ7XvnDiSSCUEl1KxO6Q
          collect_dependencies: false
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno install

  dotnet:
    name: dotnet restore (NuGet)
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: Lk0jD_w2QVSqm_-8AyQEtstYohkJkT8w5y_fj2rb2w7X_n7jyT1g-F8xMM9DKi0uNnlQ7XvnDiSSCUEl1KxO6Q
          collect_dependencies: false
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore packages.csproj

